<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数据工场 · 数据开发（ODPS / DataWorks 风格）</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d;
    --tx:#c9d1d9; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  /* 顶部：项目空间 + 环境 + 一级导航 */
  .top{background:#0b2740;border-bottom:1px solid #1f4b73;padding:0 12px;display:flex;align-items:center;gap:0;flex-wrap:wrap}
  .top .brand{font-weight:700;font-size:13px;padding:9px 12px 9px 0;color:#cfe4ff}
  .top .proj{background:#123a5c;border:1px solid #2d6b9e;border-radius:4px;padding:3px 8px;font-size:12px;color:#dbeafe;font-family:var(--mono);margin-right:10px}
  .top .env{font-size:11px;padding:2px 7px;border-radius:3px;background:#7a4b00;color:#ffd9a0;border:1px solid #a86a00}
  nav{display:flex;gap:0;margin-left:14px}
  nav button{background:transparent;border:none;border-bottom:2px solid transparent;color:#9ec5e8;padding:11px 14px;font-size:12.5px;border-radius:0;cursor:pointer}
  nav button:hover{color:#fff;border-color:transparent}
  nav button.on{color:#fff;border-bottom-color:#58a6ff;font-weight:600}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:#9ec5e8}
  /* 通用控件 */
  button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600}
  button.sm{padding:3px 8px;font-size:11px}
  button.ghost{background:transparent}
  select,input{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:12px;font-family:inherit}
  .pill{padding:2px 8px;border-radius:11px;font-size:10.5px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:#238636;background:#0f2a17}
  .pill.err{color:var(--err);border-color:#8b2c25;background:#2a1215}
  .pill.wait{color:var(--warn);border-color:#7a5c00;background:#2a2412}
  /* 应用外壳：整体不滚动，每个栏各自滚动 */
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  .top{flex:none}
  .view{display:none;flex:1;min-height:0}
  .view.on{display:flex;flex-direction:column}
  .studio{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(420px,1fr) 268px;gap:1px;background:var(--line);align-items:stretch}
  .col{background:var(--bg);padding:10px;overflow-y:auto;overscroll-behavior:contain;height:100%}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin:0 0 6px;font-weight:600}
  h3{font-size:11.5px;color:var(--dim);margin:12px 0 5px;font-weight:600}
  /* 业务流程树 */
  .fldr{font-size:12px;color:#9ec5e8;padding:4px 5px;cursor:pointer;border-radius:4px}
  .fldr:hover{background:var(--panel)}
  .nd{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 18px;border-radius:4px;cursor:pointer;font-size:12px}
  .nd:hover{background:var(--panel)}
  .nd.on{background:#0d2038;color:var(--acc)}
  .nd .badge{font-size:9px;font-family:var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--dim)}
  .nd .st{font-size:10px;margin-left:auto}
  .nd .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 编辑器标签页 */
  .tabs{display:flex;gap:1px;background:var(--line);flex-wrap:wrap}
  .tabs .tb{background:var(--panel);padding:6px 10px;font-size:11.5px;cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--dim)}
  .tabs .tb.on{background:var(--bg);color:var(--tx);border-top:2px solid var(--acc);padding-top:4px}
  .tabs .tb .x{color:#6e7681}
  .tabs .tb .x:hover{color:var(--err)}
  textarea{width:100%;background:#0b0f14;color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:10px;font-family:var(--mono);font-size:12.5px;line-height:1.62;min-height:230px;resize:vertical;tab-size:2}
  textarea:focus,select:focus,input:focus{outline:none;border-color:var(--acc)}
  .toolbar{display:flex;gap:6px;align-items:center;margin:7px 0;flex-wrap:wrap}
  /* Logview */
  .log{background:#080b0f;border:1px solid var(--line);border-radius:5px;padding:9px;font-family:var(--mono);font-size:11.5px;max-height:280px;overflow:auto}
  .log .l{display:flex;gap:8px;padding:1px 0}
  .log .lv{width:46px;flex:none;color:#6e7681}
  .log .INFO{color:#8fb8e0}.log .WARN{color:var(--warn)}.log .ERROR{color:var(--err)}
  .inst{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:5px;margin-bottom:7px;font-size:12px}
  .inst .id{font-family:var(--mono);color:var(--acc)}
  /* 表格 */
  table.res{border-collapse:collapse;font-family:var(--mono);font-size:11.5px;width:100%}
  table.res th{position:sticky;top:0;background:var(--panel2);border:1px solid var(--line);padding:4px 7px;text-align:left;color:var(--acc);white-space:nowrap}
  table.res td{border:1px solid #21262d;padding:3px 7px;white-space:nowrap}
  table.res td.null{color:#6e7681;font-style:italic}
  .scroll{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:5px}
  /* 属性面板 */
  .prop{font-size:12px;margin-bottom:7px}
  .prop label{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
  .prop input,.prop select{width:100%}
  .chk{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 0}
  .kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #21262d;font-size:11.5px}
  .kv span:last-child{font-family:var(--mono);color:var(--dim)}
  .msg{padding:7px 9px;border-radius:5px;margin-bottom:6px;font-size:12px;border-left:3px solid var(--line);background:var(--panel);white-space:pre-wrap}
  .msg.err{border-left-color:var(--err);background:#2a1215}
  .msg.warn{border-left-color:var(--warn);background:#2a2412}
  .msg.hint{border-left-color:var(--acc);background:#0d2038}
  .msg.ok{border-left-color:var(--ok);background:#0f2a17}
  .empty{color:var(--dim);font-size:12px;padding:8px 0}
  .note{font-size:11px;color:var(--dim);margin-top:5px}
  code{font-family:var(--mono);font-size:11.5px;background:#0b0f14;padding:1px 4px;border-radius:3px;border:1px solid #21262d}
  a.lnk{color:var(--acc);text-decoration:none;font-size:12px}
  .dag{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:pre;overflow-x:auto}
</style>
</head>
<body>
<div class="top">
  <span class="brand">数据工场 DataStudio</span>
  <span class="proj" id="proj">power_dw_dev</span>
  <span class="env">开发环境</span>
  <nav>
    <button data-view="dev" class="on">数据开发</button>
    <button data-view="ops">运维中心</button>
    <button data-view="map">数据地图</button>
  </nav>
  <span class="right">
    <select id="scene">
      <option value="power">电力 · power_dw_dev</option>
      <option value="bank">银行 · bank_dw_dev</option>
    </select>
    <a class="lnk" href="/pipeline.html">链路编排 →</a>
    <a class="lnk" href="/sql-console.html">SQL 控制台 →</a>
    <span class="pill" id="status">就绪</span>
  </span>
</div>

<!-- ═══════════ 数据开发 ═══════════ -->
<div class="view on" id="view-dev">
  <div class="studio">
    <!-- 左：业务流程 -->
    <div class="col">
      <h2>业务流程</h2>
      <div id="tree"></div>
      <button class="sm" id="btnNew" style="margin-top:8px">+ 新建节点</button>
      <button class="sm" id="btnRunAll" style="margin-top:4px">▶▶ 按依赖跑全流程</button>
    </div>

    <!-- 中：编辑器 + logview -->
    <div class="col">
      <div class="tabs" id="edTabs"></div>
      <div id="edWrap"><div class="empty">左侧双击节点打开编辑器。</div></div>
    </div>

    <!-- 右：节点属性 / 调度配置 -->
    <div class="col" id="props"><div class="empty">选中节点后显示属性。</div></div>
  </div>
</div>

<!-- ═══════════ 运维中心 ═══════════ -->
<div class="view" id="view-ops">
  <div class="studio" style="grid-template-columns:1fr 300px">
    <div class="col">
      <h2>周期实例</h2>
      <div class="toolbar">
        <span class="note" style="margin:0">业务日期范围</span>
        <select id="opsDays">
          <option value="2">最近 2 天</option>
          <option value="3" selected>最近 3 天</option>
          <option value="7">最近 7 天</option>
        </select>
        <button class="sm" id="btnBackfill">补数据</button>
        <span class="note" style="margin:0">（补数据会对选中节点按区间重跑分区）</span>
      </div>
      <div id="instList"></div>
    </div>
    <div class="col">
      <h2>依赖视图</h2>
      <div class="dag" id="dagView"></div>
      <h3>今日运行统计</h3>
      <div id="opsStats"></div>
    </div>
  </div>
</div>

<!-- ═══════════ 数据地图 ═══════════ -->
<div class="view" id="view-map">
  <div class="studio" style="grid-template-columns:320px 1fr">
    <div class="col">
      <h2>表清单</h2>
      <div id="catalog"></div>
    </div>
    <div class="col">
      <h2 id="tblTitle">选择左侧的表查看详情</h2>
      <div id="tblDetail"><div class="empty">点左侧任意表查看字段、分区与血缘。</div></div>
    </div>
  </div>
</div>

<script src="/vendor/sql-wasm.js"></script>
<script type="module" src="/studio.js"></script>
</body>
</html>
