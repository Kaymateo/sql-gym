<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SQL 练习场 · 刷题 + 判题</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--line:#30363d;--tx:#c9d1d9;--dim:#8b949e;--acc:#58a6ff;--ok:#3fb950;--warn:#d29922;--err:#f85149;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
  header h1{font-size:13.5px;margin:0;font-weight:600}
  header .sub{color:var(--dim);font-size:11.5px}
  .spacer{flex:1}
  select,button,input{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;font-family:inherit}
  button{cursor:pointer}button:hover{border-color:var(--acc)}
  button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600}
  button.ok{background:#238636;border-color:#238636;color:#fff;font-weight:600}
  button.sm{padding:3px 8px;font-size:11px}
  a.lnk{color:var(--acc);text-decoration:none;font-size:12px}
  .pill{padding:3px 10px;border-radius:20px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:#238636;background:#0f2a17}
  .pill.err{color:var(--err);border-color:#8b2c25;background:#2a1215}
  /* 应用外壳：整体不滚动，每个栏各自滚动（避免依赖固定的 header 高度） */
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{flex:none}
  main{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(440px,1fr) 320px;gap:1px;background:var(--line);align-items:stretch}
  .col{background:var(--bg);padding:11px;overflow-y:auto;overscroll-behavior:contain;height:100%}
  h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin:0 0 7px;font-weight:600}
  h3{font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:600}
  .grp{margin-bottom:9px}
  .tbl{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12px}
  .tbl:hover{background:var(--panel)}
  .tbl .nm{flex:1;font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl .rc{color:var(--dim);font-size:10.5px}
  .cols{margin:2px 0 6px 10px;border-left:1px solid var(--line);padding-left:8px}
  .colf{padding:1px 0;font-size:11px;cursor:pointer}
  .colf:hover{color:var(--acc)}
  .colf .cn{font-family:var(--mono)}.colf .ct{color:#7d8590;font-family:var(--mono);font-size:10px}
  .colf .cc{color:var(--dim);font-size:10.5px}
  /* 题目列表 */
  .prob{display:flex;gap:6px;align-items:flex-start;padding:6px 7px;border:1px solid var(--line);border-radius:5px;margin-bottom:5px;cursor:pointer;background:var(--panel)}
  .prob:hover{border-color:#444c56}
  .prob.on{border-color:var(--acc);background:#0d2038}
  .prob.solved{border-color:#238636}
  .prob .lv{font-size:9.5px;font-family:var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--acc);flex:none}
  .prob .tt{font-size:11.5px;line-height:1.35}
  .prob .st{font-size:11px;flex:none}
  /* 题面 */
  .brief{border:1px solid #1f4b73;background:#0b2740;border-radius:6px;padding:9px 11px;margin-bottom:9px}
  .brief h4{margin:0 0 5px;font-size:13px;color:#cfe4ff}
  .brief .req{font-size:12.5px;white-space:pre-wrap;margin:5px 0}
  .brief .bg{color:#9ec5e8;font-size:12px;margin:3px 0}
  .brief .tags{margin-top:5px}
  .tag{display:inline-block;font-size:10px;font-family:var(--mono);border:1px solid #2d6b9e;color:#9ec5e8;border-radius:3px;padding:0 4px;margin:0 4px 3px 0}
  textarea{width:100%;background:#0b0f14;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:var(--mono);font-size:12.5px;line-height:1.6;min-height:230px;resize:vertical;tab-size:2}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--acc)}
  .bar{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
  .msg{padding:8px 10px;border-radius:6px;margin-bottom:6px;font-size:12px;border-left:3px solid var(--line);background:var(--panel);white-space:pre-wrap}
  .msg.err{border-left-color:var(--err);background:#2a1215}
  .msg.warn{border-left-color:var(--warn);background:#2a2412}
  .msg.hint{border-left-color:var(--acc);background:#0d2038}
  .msg.ok{border-left-color:var(--ok);background:#0f2a17}
  .msg.close{border-left-color:var(--warn);background:#2a2412}
  table.res{border-collapse:collapse;font-family:var(--mono);font-size:11.5px;width:100%}
  table.res th{position:sticky;top:0;background:var(--panel2);border:1px solid var(--line);padding:4px 7px;text-align:left;color:var(--acc);white-space:nowrap}
  table.res td{border:1px solid #21262d;padding:3px 7px;white-space:nowrap}
  table.res td.null{color:#6e7681;font-style:italic}
  .scroll{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:6px}
  .tree{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:pre;overflow-x:auto}
  .tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{font-size:11px;padding:3px 9px}
  .tabs button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #21262d;font-size:11.5px}
  .empty{color:var(--dim);font-size:12px;padding:8px 0}
  .note{font-size:11px;color:var(--dim);margin-top:5px}
  code{font-family:var(--mono);font-size:11.5px;background:#0b0f14;padding:1px 4px;border-radius:3px;border:1px solid #21262d}
  .sol{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:9px;font-family:var(--mono);font-size:11.5px;white-space:pre;overflow-x:auto;color:#a5d6a7}
  .bar2{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:4px 0 8px}
  .bar2 i{display:block;height:100%;background:var(--ok)}
</style>
</head>
<body>
<header>
  <h1>SQL 练习场</h1>
  <span class="sub" id="sceneInfo">加载中…</span>
  <span class="spacer"></span>
  <select id="scene"><option value="power">电力场景</option><option value="bank">银行场景</option></select>
  <button id="btnRun" class="primary" disabled>▶ 运行</button>
  <button id="btnSubmit" class="ok" disabled>✓ 提交判题</button>
  <button id="btnReset" class="sm">重置数仓</button>
  <a class="lnk" href="/">数据开发 →</a>
  <span class="pill" id="status">就绪</span>
</header>
<main>
  <!-- 左：表 -->
  <div class="col"><h2>数据表</h2><div id="tree"><div class="empty">加载中…</div></div></div>

  <!-- 中：题面 + 编辑器 + 结果 -->
  <div class="col">
    <div id="problemBox"></div>
    <div class="bar">
      <span class="note" style="margin:0">编辑器（Ctrl+Enter 运行 / Ctrl+Shift+Enter 提交）</span>
      <span class="mono" id="runInfo" style="color:var(--dim);margin-left:auto"></span>
    </div>
    <textarea id="sql" spellcheck="false"></textarea>
    <div class="bar">
      <button id="btnRun2" class="primary">▶ 运行</button>
      <button id="btnSubmit2" class="ok">✓ 提交判题</button>
      <button id="btnClear" class="sm">清空</button>
      <button id="btnShowcase" class="sm">载入复杂示例</button>
    </div>
    <div id="feedback"></div>
    <div class="tabs" style="margin-top:8px">
      <button data-tab="result" class="on">结果</button><button data-tab="hdfs">HDFS 产物</button>
      <button data-tab="warehouse">数仓分区</button><button data-tab="dict">数据字典（中文）</button><button data-tab="history">历史 SQL</button>
    </div>
    <div id="pane"><div class="empty">运行 SQL 后这里显示结果。</div></div>
  </div>

  <!-- 右：题库 -->
  <div class="col">
    <h2>题库 <span id="progText" class="note"></span></h2>
    <div class="bar2"><i id="progBar" style="width:0"></i></div>
    <div id="probList"><div class="empty">加载中…</div></div>
    <h2 style="margin-top:14px">SQL 速查</h2>
    <div id="snippets"></div>
  </div>
</main>
<script src="/vendor/sql-wasm.js"></script>
<script type="module" src="/sql.js"></script>
</body>
</html>
