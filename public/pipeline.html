<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SQL 训练场 · 链路编排</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d;
    --tx:#c9d1d9; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.3px}
  header .sub{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  select,button,input{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;font-family:inherit}
  button{cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600}
  button.primary:hover{background:#388bfd}
  button:disabled{opacity:.5;cursor:not-allowed}
  .pill{padding:3px 10px;border-radius:20px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:#238636;background:#0f2a17}
  .pill.err{color:var(--err);border-color:#8b2c25;background:#2a1215}
  .pill.run{color:var(--acc);border-color:#1f6feb;background:#0d2038}
  main{display:grid;grid-template-columns:290px minmax(420px,1fr) 380px;gap:1px;background:var(--line);min-height:calc(100vh - 53px)}
  .col{background:var(--bg);padding:12px;overflow:auto;max-height:calc(100vh - 53px)}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:0 0 8px;font-weight:600}
  h3{font-size:12px;color:var(--dim);margin:14px 0 6px;font-weight:600}
  .palette{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .palette button{font-size:11px;padding:4px 8px}
  .node{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;margin-bottom:5px;cursor:pointer;background:var(--panel)}
  .node:hover{border-color:#444c56}
  .node.sel{border-color:var(--acc);background:#0d2038}
  .node .idx{color:var(--dim);font-family:var(--mono);font-size:11px}
  .node .ttl{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .st{font-size:12px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px}
  .field input,.field select{width:100%}
  textarea{width:100%;background:#0b0f14;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:var(--mono);font-size:12px;line-height:1.55;min-height:250px;resize:vertical;tab-size:2}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--acc)}
  .stages{display:flex;gap:6px;margin:8px 0}
  .stage{flex:1;text-align:center;padding:5px 2px;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--dim);background:var(--panel)}
  .stage.ok{color:var(--ok);border-color:#238636;background:#0f2a17}
  .stage.err{color:var(--err);border-color:#8b2c25;background:#2a1215}
  .msg{padding:8px 10px;border-radius:6px;margin-bottom:6px;font-size:12px;border-left:3px solid var(--line);background:var(--panel)}
  .msg.err{border-left-color:var(--err);background:#2a1215}
  .msg.warn{border-left-color:var(--warn);background:#2a2412}
  .msg.hint{border-left-color:var(--acc);background:#0d2038}
  .msg.ok{border-left-color:var(--ok);background:#0f2a17}
  .mono{font-family:var(--mono);font-size:11.5px}
  .tree{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:pre;overflow-x:auto}
  .tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{font-size:11px;padding:4px 9px}
  .tabs button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed #21262d;font-size:12px}
  .kv span:last-child{font-family:var(--mono);color:var(--dim)}
  .empty{color:var(--dim);font-size:12px;padding:10px 0}
  .dep{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--acc);cursor:pointer;margin-right:4px}
  code{font-family:var(--mono);font-size:11.5px;background:#0b0f14;padding:1px 4px;border-radius:3px;border:1px solid #21262d}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .note{font-size:11px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>SQL 训练场 · 数据链路工作台</h1>
  <span class="sub" id="sceneInfo">加载中…</span>
  <span class="spacer"></span>
  <select id="scene">
    <option value="power">电力场景（电网营销）</option>
    <option value="bank">银行场景（零售信贷）</option>
  </select>
  <button id="btnDemo">载入示例链路</button>
  <button id="btnRun" class="primary" disabled>▶ 运行链路</button>
  <span class="pill" id="status">未运行</span>
</header>

<main>
  <!-- 左：节点库 + 链路 -->
  <div class="col">
    <h2>节点库（点击添加）</h2>
    <div class="palette" id="palette"></div>
    <h2>链路节点</h2>
    <div id="nodeList"><div class="empty">还没有节点。先「载入示例链路」或点上面的节点库添加。</div></div>
  </div>

  <!-- 中：节点详情 -->
  <div class="col" id="detail">
    <div class="empty">左侧选择/添加一个节点开始。</div>
  </div>

  <!-- 右：执行结果 -->
  <div class="col">
    <div class="tabs" id="tabs">
      <button data-tab="logs" class="on">执行日志</button>
      <button data-tab="hdfs">HDFS</button>
      <button data-tab="hive">数仓</button>
      <button data-tab="lineage">血缘</button>
    </div>
    <div id="resultPane"><div class="empty">运行链路后这里显示执行过程与产物。</div></div>
  </div>
</main>

<script src="/vendor/sql-wasm.js"></script>
<script type="module" src="/pipeline.js"></script>
</body>
</html>
